name: OIDC role probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Assume role and inspect identity
        run: |
          set -u
          TOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value // empty')
          if [ -z "$TOKEN" ]; then echo "no_token"; exit 0; fi
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{iss,aud,sub,repository,repository_owner,ref,event_name,workflow_ref}'
          OUT=$(aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::405785876631:role/github-actions-grid-wallet-prod \
            --role-session-name probe \
            --duration-seconds 900 \
            --web-identity-token "$TOKEN" 2>&1) || true
          if printf '%s' "$OUT" | jq -e '.Credentials.AccessKeyId' >/dev/null 2>&1; then
            echo "ASSUME_OK"
            printf '%s' "$OUT" | jq '{AssumedRoleUser:.AssumedRoleUser.Arn, Expiration:.Credentials.Expiration}'
            export AWS_ACCESS_KEY_ID=$(printf '%s' "$OUT" | jq -r '.Credentials.AccessKeyId')
            export AWS_SECRET_ACCESS_KEY=$(printf '%s' "$OUT" | jq -r '.Credentials.SecretAccessKey')
            export AWS_SESSION_TOKEN=$(printf '%s' "$OUT" | jq -r '.Credentials.SessionToken')
            export AWS_DEFAULT_REGION=us-west-2
            aws sts get-caller-identity --output json
            aws ecr describe-repositories --max-items 5 --output json 2>&1 | head -c 800
          else
            echo "ASSUME_FAIL"
            printf '%s\n' "$OUT" | head -c 600
          fi
