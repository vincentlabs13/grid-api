name: Stainless OIDC probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Stainless OIDC acceptance
        run: |
          set -u
          RESP=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.stainless.com" || true)
          TOKEN=$(printf '%s' "$RESP" | jq -r '.value // empty')
          if [ -z "$TOKEN" ]; then echo "no_token"; printf '%s\n' "$RESP" | head -c 300; exit 0; fi
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{iss,aud,sub,repository,repository_owner,ref,event_name,workflow_ref}'
          for u in "https://api.stainless.com/v0/user" "https://api.stainless.com/v0/orgs/lightspark" "https://api.stainless.com/v0/projects/grid"; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$u" || true)
            echo "GET $u -> $code"
            head -c 300 /tmp/resp
            echo
          done
